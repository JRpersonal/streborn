name: CodeQL

# Static security analysis for Go. Runs on every PR and push to main,
# plus weekly so newly disclosed query patterns catch existing code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:30 UTC. Avoid the top of the hour to dodge GitHub's
    # scheduler congestion.
    - cron: "30 6 * * 1"

# Minimal at the top level; the analyze job below elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Only a superseded PR push is cancelled. Back-to-back merges to main used
  # to cancel the earlier main run, which then showed up as a red X on the
  # commit list for a run nobody meant to abandon (Jens, 2026-09-06).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload CodeQL results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # The query suite and the one excluded rule (with the reason) live here.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
