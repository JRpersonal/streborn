name: Scorecard supply-chain security

# OpenSSF Scorecard: an automatic, reproducible audit of this repo's
# security posture (branch protection, pinned dependencies, signed
# releases, token hygiene, dangerous workflow patterns, ...). It runs
# weekly and on every push to main. Results are uploaded to the GitHub
# Security tab and published to the public Scorecard API, which feeds the
# Scorecard badge shown in the README. Anyone can therefore see at a
# glance how the repo is kept clean, automatically and without taking the
# maintainer's word for it.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC
  push:
    branches: [main]

# Least privilege by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to the Security tab
      id-token: write # publish results to the public Scorecard API (badge)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained PAT (Administration: read-only) so the Branch-Protection
          # check can read the classic protection rules. See ossf/scorecard-action
          # docs/authentication/fine-grained-auth-token.md.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
